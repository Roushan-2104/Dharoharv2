services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dharohar-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: node --watch server.js
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/entities', (r) => { process.exit(r.statusCode === 200 || r.statusCode === 500 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dharohar-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dharohar-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - dharohar-network

networks:
  dharohar-network:
    driver: bridge
