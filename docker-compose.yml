# ----------------------------------------------------
# Development stack with live reload.
# Run with: docker compose up --build
# Then open http://localhost:5173 (API health: http://localhost:3000/api/health)
# Secrets come from ./.env (copy .env.example). Without it the app still runs on
# bundled data, but the chatbot falls back to offline answers.
# ----------------------------------------------------
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dharohar-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: node --watch server.js
    networks:
      - dharohar-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dharohar-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Empty: the browser calls /api on the Vite server, which proxies it to the backend container
      - VITE_API_URL=
      - VITE_PROXY_TARGET=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dharohar-network

networks:
  dharohar-network:
    driver: bridge
