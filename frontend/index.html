<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dharohar: India's heritage on one globe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:wght@400;500;700&family=Radio+Canada:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Sans+Oriya:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Opening screen: shown at once, before the app loads; src/splash.js moves the progress rule
         through its stages and removes the screen once the backend, the records and the globe are ready */
      #splash { --paper: #f8f7f3; --ink: #0f141e; --muted: #5b6170; --mark: #d9241b; --ease: cubic-bezier(0.22, 1, 0.36, 1);
        position: fixed; inset: 0; z-index: 9999; display: grid; grid-template-rows: 1fr auto; background: var(--paper); color: var(--ink);
        font-family: "Radio Canada", system-ui, sans-serif; transition: opacity 700ms ease-out; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash .splash-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(16px, 3vh, 32px); padding: 0 16px; text-align: center; }
      #splash svg { width: clamp(84px, 11vw, 132px); height: auto; color: var(--mark); fill: var(--mark); animation: splash-fade 1400ms ease-out both, splash-spin 24s linear infinite; }
      #splash .splash-name { font-family: "Radio Canada Big", system-ui, sans-serif; font-weight: 700; line-height: 0.9; font-size: clamp(56px, 14vw, 184px);
        letter-spacing: -0.035em; white-space: nowrap; animation: splash-fade 1600ms ease-out 200ms both, splash-breathe 4s ease-in-out 1800ms infinite; }
      #splash .splash-scripts { position: relative; height: 1.6em; width: 100%; font-size: clamp(20px, 2.6vw, 30px); font-weight: 500; color: var(--mark); }
      #splash .splash-scripts span { position: absolute; inset: 0; opacity: 0; animation: splash-cycle 7.5s ease-in-out infinite; }
      #splash .splash-scripts span:nth-child(1) { font-family: "Radio Canada", system-ui, sans-serif; animation-delay: 700ms; }
      #splash .splash-scripts span:nth-child(2) { font-family: "Noto Sans Devanagari", system-ui, sans-serif; animation-delay: 3200ms; }
      #splash .splash-scripts span:nth-child(3) { font-family: "Noto Sans Oriya", system-ui, sans-serif; animation-delay: 5700ms; }
      #splash .splash-foot { padding: 0 clamp(16px, 4vw, 64px) clamp(20px, 5vh, 48px); animation: splash-fade 1200ms ease-out 600ms both; }
      #splash .splash-rule { height: 3px; background: #e3e1da; overflow: hidden; }
      #splash .splash-rule i { display: block; height: 100%; background: var(--ink); transform: scaleX(0.04); transform-origin: left; transition: transform 600ms ease-out; }
      #splash .splash-stage span, #splash .splash-stage b { transition: opacity 400ms ease-out; }
      #splash .splash-stage { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; font-size: 15px; color: var(--muted); }
      #splash .splash-stage b { font-weight: 500; color: var(--ink); }
      #splash .splash-slow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 15px; color: var(--ink); }
      #splash .splash-slow[hidden] { display: none; }
      #splash button { min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font: 500 15px "Radio Canada", system-ui, sans-serif; cursor: pointer; }
      #splash button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-fade { from { opacity: 0; } }
      @keyframes splash-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @keyframes splash-cycle { 0% { opacity: 0; } 8%, 28% { opacity: 1; } 36%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation: none !important; transition: none !important; }
        #splash .splash-scripts span:nth-child(1) { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-center">

="7.86" cy="44.45" r="1.7"/><circle cx="10.74" cy="33.74" r="1.7"/><circle cx="16.28" cy="24.13" r="1.7"/><circle cx="24.13" cy="16.28" r="1.7"/><circle cx="33.74" cy="10.74" r="1.7"/><circle cx="44.45" cy="7.86" r="1.7"/></svg>
        <h1 class="splash-name">Dharohar</h1>
        <div class="splash-scripts" aria-hidden="true"><span>India's living heritage, on one globe</span><span>धरोहर · भारत की जीवित विरासत</span><span>ଧରୋହର · ଭାରତର ଜୀବନ୍ତ ଐତିହ୍ୟ</span></div>
      </div>
      <div class="splash-foot" role="status" aria-live="polite">
        <div class="splash-rule"><i data-bar></i></div>
        <div class="splash-stage"><b data-stage>Waking the server</b><span data-step>1 of 3</span></div>
        <div class="splash-slow" data-slow hidden>The server is taking longer than usual. <button type="button" data-continue>Continue anyway</button></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
