# ----------------------------------------------------
# Production Docker Compose (Optimized Nginx + Node)
# Run with: docker compose -f docker-compose.prod.yml up --build -d
# Then open http://localhost (or set WEB_PORT=8080 in .env to use another port)
# ----------------------------------------------------
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dharohar-backend-prod
    restart: unless-stopped
    # Not published to the host: only Nginx (frontend container) reaches it at backend:3000
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - TRUST_PROXY=1
    networks:
      - dharohar-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: dharohar-frontend-prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dharohar-network

networks:
  dharohar-network:
    driver: bridge
